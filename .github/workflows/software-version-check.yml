name: Software Version Update

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows committing and pushing changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and auto-update software versions
        run: |
          # Fetch latest versions
          LATEST_CHROME=$(python3 -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions').read())['versions'][0]['version'])")
          LATEST_FIREFOX=$(python3 -c "import urllib.request, re; req = urllib.request.Request('https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US', method='HEAD'); res = urllib.request.urlopen(req); url = res.url; print(re.search(r'/releases/([0-9.]+)/', url).group(1))")
          LATEST_ZEN=$(python3 -c "import urllib.request, json; req = urllib.request.Request('https://api.github.com/repos/zen-browser/desktop/releases/latest', headers={'User-Agent': 'Mozilla/5.0'}); res = urllib.request.urlopen(req); data = json.loads(res.read()); print(data['tag_name'])")

          echo "Latest Chrome: $LATEST_CHROME"
          echo "Latest Firefox: $LATEST_FIREFOX"
          echo "Latest Zen: $LATEST_ZEN"

          # Perform updates in python
          python3 -c "
import re

def update_file(path, var_name, value):
    with open(path, 'r') as f:
        content = f.read()
    pattern = rf'({var_name}=\")[^\"]+(\")'
    new_content, count = re.subn(pattern, rf'\g<1>{value}\g<2>', content)
    if count > 0:
        with open(path, 'w') as f:
            f.write(new_content)
        print(f'Updated {var_name} to {value} in {path}')

for file_path in ['debian.sh', 'fedora.sh']:
    update_file(file_path, 'CHROME_VERSION', '$LATEST_CHROME')
    update_file(file_path, 'FIREFOX_VERSION', '$LATEST_FIREFOX')
    update_file(file_path, 'ZEN_VERSION', '$LATEST_ZEN')
"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add debian.sh fedora.sh
          
          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No updates detected. Scripts are already up-to-date."
          else
            git commit -m "chore: auto-update software versions to latest stable (automatically done by GH Actions./.)"
            git push
            echo "Successfully updated and pushed new versions to repository!"
          fi
